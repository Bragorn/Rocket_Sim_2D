<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rocket Builder</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; color: #e8eef2; font: 12px/1.35 monospace; user-select: none; }
  body { display: flex; }
  #left { width: 290px; flex: none; display: flex; flex-direction: column; background: #0a0e12; border-right: 1px solid rgba(255,255,255,0.14); }
  #right { width: 270px; flex: none; overflow-y: auto; background: #0a0e12; border-left: 1px solid rgba(255,255,255,0.14); scrollbar-width: thin; scrollbar-color: #3a4854 transparent; }
  #stage { flex: 1; min-width: 0; display: block; cursor: default; }
  .tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.14); }
  .tab { flex: 1; padding: 9px 2px; text-align: center; cursor: pointer; color: #8a98a3; border-bottom: 2px solid transparent; }
  .tab:hover { color: #e8eef2; }
  .tab.on { color: #e8eef2; border-bottom-color: #4aa3ff; background: rgba(74,163,255,0.10); }
  #cards { flex: 1; overflow-y: auto; padding: 8px; scrollbar-width: thin; scrollbar-color: #3a4854 transparent; }
  .hint { color: #8a98a3; padding: 2px 2px 8px; }
  .card { display: flex; gap: 10px; padding: 8px; margin-bottom: 8px; background: #141b22; border: 1px solid rgba(255,255,255,0.14); cursor: grab; }
  .card:hover { border-color: #4aa3ff; background: #182430; }
  .card canvas { flex: none; background: #0d1318; }
  .card .t { font-weight: bold; margin-bottom: 3px; }
  .card .s { color: #8a98a3; font-size: 11px; }
  .ctl { display: flex; align-items: center; gap: 4px; margin: 6px 0 2px; }
  .ctl .k { color: #8a98a3; width: 48px; }
  .chip { padding: 2px 8px; font: inherit; color: inherit; background: #1b242c; border: 1px solid rgba(255,255,255,0.18); cursor: pointer; }
  .chip:hover { background: #26333d; }
  .chip.on { background: rgba(74,163,255,0.28); border-color: #4aa3ff; }
  .val { min-width: 44px; text-align: center; }
  .sec { padding: 10px 12px 3px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.14); }
  .row { display: flex; justify-content: space-between; padding: 1px 12px; }
  .row .k { color: #8a98a3; }
  .good { color: #5fd38d; } .warn { color: #f0b33c; } .bad { color: #ff6b5e; }
  .box { padding: 6px 12px; min-height: 18px; }
  .btn { padding: 7px 0; font: inherit; color: #e8eef2; background: #1b242c; border: 1px solid rgba(255,255,255,0.22); cursor: pointer; }
  .btn:hover:not(:disabled) { background: #26333d; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.go { background: #e8eef2; color: #101418; border-color: #e8eef2; font-weight: bold; }
  .btn.go:hover:not(:disabled) { background: #fff; }
  .btns { display: flex; gap: 6px; padding: 6px 12px; }
  .btns .btn { flex: 1; }
  input[type=text], select { width: 100%; box-sizing: border-box; padding: 5px; font: inherit; color: #e8eef2; background: #141b22; border: 1px solid rgba(255,255,255,0.22); user-select: text; }
  .pad { padding: 6px 12px; }
</style>
</head>
<body>
<div id="left"></div>
<canvas id="stage"></canvas>
<div id="right"></div>

<!-- Plain scripts, loaded in this order. The builder shares the game's rules, parts and air-force code. -->
<script src="js/planck.min.js"></script>  <!-- (only because the shared files check for it) -->
<script src="js/util.js"></script>
<script src="js/settings.js"></script>
<script src="js/rules.js"></script>       <!-- the rules every part follows -->
<script src="js/parts.js"></script>       <!-- the part library -->
<script src="js/design.js"></script>      <!-- designs: format, checking, saving, assembling -->
<script src="js/aero.js"></script>        <!-- air-force code (used for the stability reading) -->
<script src="js/stats.js"></script>       <!-- mass, fuel, delta-v, stability of a design -->
<script src="js/edit.js"></script>        <!-- snapping and editing -->
<script src="js/builder.js"></script>     <!-- this page -->
</body>
</html>
